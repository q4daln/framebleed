<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>framebleed</title>
        <link rel="stylesheet" href="/static/styles.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>framebleed</h1>
                <p>local datamosh experiment</p>
            </header>

            <form id="mosh-form">
                <section class="grid">
                    <div class="panel">
                        <h2>clip a</h2>

                        <label>
                            video
                            <input
                                id="clip-a"
                                name="clip_a"
                                type="file"
                                accept="video/*"
                                required
                            />
                        </label>

                        <div class="controls">
                            <video id="preview-a" controls></video>

                            <div class="metadata-row">
                                <span
                                    >current:
                                    <strong id="current-a"
                                        >00:00:00</strong
                                    ></span
                                >
                                <span
                                    >duration:
                                    <strong id="duration-a">--:--</strong></span
                                >
                            </div>

                            <div class="time-row">
                                <label>
                                    start
                                    <input
                                        id="a-start"
                                        name="a_start"
                                        type="text"
                                        value="00:00:00"
                                        required
                                    />
                                </label>
                                <button
                                    type="button"
                                    data-set-time="a-start"
                                    data-video="preview-a"
                                >
                                    set
                                </button>
                            </div>

                            <div class="time-row">
                                <label>
                                    end
                                    <input
                                        id="a-end"
                                        name="a_end"
                                        type="text"
                                        value="00:00:03"
                                        required
                                    />
                                </label>
                                <button
                                    type="button"
                                    data-set-time="a-end"
                                    data-video="preview-a"
                                >
                                    set
                                </button>
                            </div>

                            <div class="button-row">
                                <button
                                    type="button"
                                    data-jump-time="a-start"
                                    data-video="preview-a"
                                >
                                    preview start
                                </button>
                                <button
                                    type="button"
                                    data-jump-time="a-end"
                                    data-video="preview-a"
                                >
                                    preview end
                                </button>
                                <button
                                    type="button"
                                    data-full-range="a"
                                    data-video="preview-a"
                                >
                                    full range
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="panel">
                        <h2>clip b</h2>

                        <label>
                            video
                            <input
                                id="clip-b"
                                name="clip_b"
                                type="file"
                                accept="video/*"
                                required
                            />
                        </label>

                        <div class="controls">
                            <video id="preview-b" controls></video>

                            <div class="metadata-row">
                                <span
                                    >current:
                                    <strong id="current-b"
                                        >00:00:00</strong
                                    ></span
                                >
                                <span
                                    >duration:
                                    <strong id="duration-b">--:--</strong></span
                                >
                            </div>

                            <div class="time-row">
                                <label>
                                    start
                                    <input
                                        id="b-start"
                                        name="b_start"
                                        type="text"
                                        value="00:00:00"
                                        required
                                    />
                                </label>
                                <button
                                    type="button"
                                    data-set-time="b-start"
                                    data-video="preview-b"
                                >
                                    set
                                </button>
                            </div>

                            <div class="time-row">
                                <label>
                                    end
                                    <input
                                        id="b-end"
                                        name="b_end"
                                        type="text"
                                        value="00:00:03"
                                        required
                                    />
                                </label>
                                <button
                                    type="button"
                                    data-set-time="b-end"
                                    data-video="preview-b"
                                >
                                    set
                                </button>
                            </div>

                            <div class="button-row">
                                <button
                                    type="button"
                                    data-jump-time="b-start"
                                    data-video="preview-b"
                                >
                                    preview start
                                </button>
                                <button
                                    type="button"
                                    data-jump-time="b-end"
                                    data-video="preview-b"
                                >
                                    preview end
                                </button>
                                <button
                                    type="button"
                                    data-full-range="b"
                                    data-video="preview-b"
                                >
                                    full range
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="panel settings">
                    <label>
                        resolution
                        <select id="resolution" name="resolution">
                            <option value="1080p" selected>1080p</option>
                            <option value="720p">720p</option>
                            <option value="original">original</option>
                        </select>
                    </label>

                    <label class="checkbox-label">
                        <input id="mosh" name="mosh" type="checkbox" checked />
                        datamosh transition
                    </label>
                </section>

                <section class="panel output">
                    <div class="output-header">
                        <div>
                            <h2>result</h2>
                            <p id="result-note">
                                generate a transition to preview it here.
                            </p>
                        </div>
                    </div>

                    <button id="generate" class="primary" type="submit">
                        generate datamosh
                    </button>
                    <div id="status" class="status"></div>

                    <div id="result-wrap" class="result-wrap" hidden>
                        <video id="result" controls></video>

                        <div class="result-actions">
                            <a
                                id="download"
                                class="button-link"
                                href="#"
                                download="framebleed.mp4"
                                >download mp4</a
                            >
                            <button id="clear-result" type="button">
                                clear result
                            </button>
                        </div>
                    </div>
                </section>
            </form>

            <footer>
                videos are processed locally by the backend running on this
                machine.
            </footer>
        </main>

        <script src="/static/app.js"></script>
    </body>
</html>
