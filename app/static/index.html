<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>framebleed</title>
        <style>
            :root {
                --bg: #0b0b0b;
                --panel: #151515;
                --panel-soft: #1c1c1c;
                --text: #e6e6e6;
                --muted: #969696;
                --faint: #666;
                --line: #2a2a2a;
                --accent: #d07860;
                --danger: #ff6b6b;
            }

            * {
                box-sizing: border-box;
            }

            [hidden] {
                display: none !important;
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                line-height: 1.5;
            }

            main {
                width: min(1180px, calc(100vw - 32px));
                margin: 0 auto;
                padding: 32px 0 48px;
            }

            header {
                margin-bottom: 28px;
            }

            h1 {
                margin: 0 0 4px;
                font-size: 28px;
                line-height: 1.1;
                letter-spacing: -0.04em;
                font-weight: 650;
            }

            p {
                margin: 0;
                color: var(--muted);
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
            }

            .panel {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 16px;
                padding: 16px;
            }

            .panel h2 {
                margin: 0 0 12px;
                font-size: 14px;
                font-weight: 600;
                color: var(--text);
                text-transform: lowercase;
            }

            .controls {
                display: grid;
                gap: 12px;
                margin-top: 12px;
            }

            video {
                width: 100%;
                aspect-ratio: 16 / 9;
                background: #050505;
                border: 1px solid var(--line);
                border-radius: 12px;
                display: block;
            }

            label {
                display: grid;
                gap: 6px;
                color: var(--muted);
                font-size: 13px;
            }

            input,
            select,
            button {
                font: inherit;
            }

            input[type="file"],
            input[type="text"],
            select {
                width: 100%;
                min-height: 38px;
                color: var(--text);
                background: var(--panel-soft);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 8px 10px;
            }

            input[type="checkbox"] {
                accent-color: var(--accent);
            }

            .time-row {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 8px;
                align-items: end;
            }

            button {
                min-height: 38px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: var(--panel-soft);
                color: var(--text);
                padding: 8px 12px;
                cursor: pointer;
            }

            button:hover {
                border-color: #444;
            }

            button.primary {
                width: 100%;
                background: var(--accent);
                border-color: var(--accent);
                color: #111;
                font-weight: 650;
            }

            button:disabled {
                opacity: 0.55;
                cursor: not-allowed;
            }

            .settings {
                margin-top: 16px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }

            .checkbox-label {
                min-height: 38px;
                display: flex;
                align-items: center;
                gap: 8px;
                padding-top: 21px;
            }

            .output {
                margin-top: 16px;
            }

            .status {
                margin-top: 12px;
                min-height: 24px;
                color: var(--muted);
                font-size: 14px;
            }

            .status.error {
                color: var(--danger);
                white-space: pre-wrap;
            }

            .download {
                display: inline-block;
                margin-top: 12px;
                color: var(--accent);
                text-decoration: none;
            }

            .download:hover {
                text-decoration: underline;
            }

            footer {
                margin-top: 18px;
                color: var(--faint);
                font-size: 13px;
            }

            @media (max-width: 800px) {
                .grid,
                .settings {
                    grid-template-columns: 1fr;
                }

                main {
                    width: min(100vw - 20px, 1180px);
                    padding-top: 20px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <h1>framebleed</h1>
                <p>local datamosh experiment</p>
            </header>

            <form id="mosh-form">
                <section class="grid">
                    <div class="panel">
                        <h2>clip a</h2>

                        <label>
                            video
                            <input
                                id="clip-a"
                                name="clip_a"
                                type="file"
                                accept="video/*"
                                required
                            />
                        </label>

                        <div class="controls">
                            <video id="preview-a" controls></video>

                            <div class="time-row">
                                <label>
                                    start
                                    <input
                                        id="a-start"
                                        name="a_start"
                                        type="text"
                                        value="00:00:00"
                                        required
                                    />
                                </label>
                                <button
                                    type="button"
                                    data-set-time="a-start"
                                    data-video="preview-a"
                                >
                                    set
                                </button>
                            </div>

                            <div class="time-row">
                                <label>
                                    end
                                    <input
                                        id="a-end"
                                        name="a_end"
                                        type="text"
                                        value="00:00:03"
                                        required
                                    />
                                </label>
                                <button
                                    type="button"
                                    data-set-time="a-end"
                                    data-video="preview-a"
                                >
                                    set
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="panel">
                        <h2>clip b</h2>

                        <label>
                            video
                            <input
                                id="clip-b"
                                name="clip_b"
                                type="file"
                                accept="video/*"
                                required
                            />
                        </label>

                        <div class="controls">
                            <video id="preview-b" controls></video>

                            <div class="time-row">
                                <label>
                                    start
                                    <input
                                        id="b-start"
                                        name="b_start"
                                        type="text"
                                        value="00:00:00"
                                        required
                                    />
                                </label>
                                <button
                                    type="button"
                                    data-set-time="b-start"
                                    data-video="preview-b"
                                >
                                    set
                                </button>
                            </div>

                            <div class="time-row">
                                <label>
                                    end
                                    <input
                                        id="b-end"
                                        name="b_end"
                                        type="text"
                                        value="00:00:03"
                                        required
                                    />
                                </label>
                                <button
                                    type="button"
                                    data-set-time="b-end"
                                    data-video="preview-b"
                                >
                                    set
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="panel settings">
                    <label>
                        resolution
                        <select id="resolution" name="resolution">
                            <option value="1080p" selected>1080p</option>
                            <option value="720p">720p</option>
                            <option value="original">original</option>
                        </select>
                    </label>

                    <label class="checkbox-label">
                        <input id="mosh" name="mosh" type="checkbox" checked />
                        datamosh transition
                    </label>
                </section>

                <section class="panel output">
                    <button id="generate" class="primary" type="submit">
                        generate
                    </button>
                    <div id="status" class="status"></div>
                    <video id="result" controls hidden></video>
                    <a
                        id="download"
                        class="download"
                        href="#"
                        download="framebleed.mp4"
                        hidden
                        >download mp4</a
                    >
                </section>
            </form>

            <footer>
                videos are processed locally by the backend running on this
                machine.
            </footer>
        </main>

        <script>
            const form = document.querySelector("#mosh-form");
            const statusEl = document.querySelector("#status");
            const generateButton = document.querySelector("#generate");
            const resultVideo = document.querySelector("#result");
            const downloadLink = document.querySelector("#download");

            let resultUrl = null;

            bindPreview("clip-a", "preview-a");
            bindPreview("clip-b", "preview-b");

            document.querySelectorAll("[data-set-time]").forEach((button) => {
                button.addEventListener("click", () => {
                    const input = document.querySelector(
                        `#${button.dataset.setTime}`,
                    );
                    const video = document.querySelector(
                        `#${button.dataset.video}`,
                    );
                    input.value = secondsToTimestamp(video.currentTime);
                });
            });

            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                clearResult();
                setStatus("processing...");
                generateButton.disabled = true;

                try {
                    const clipA = document.querySelector("#clip-a").files[0];
                    const clipB = document.querySelector("#clip-b").files[0];

                    if (!clipA || !clipB) {
                        throw new Error("choose both clips first.");
                    }

                    const formData = new FormData();
                    formData.append("clip_a", clipA);
                    formData.append("clip_b", clipB);
                    formData.append(
                        "a_start",
                        document.querySelector("#a-start").value,
                    );
                    formData.append(
                        "a_end",
                        document.querySelector("#a-end").value,
                    );
                    formData.append(
                        "b_start",
                        document.querySelector("#b-start").value,
                    );
                    formData.append(
                        "b_end",
                        document.querySelector("#b-end").value,
                    );
                    formData.append(
                        "resolution",
                        document.querySelector("#resolution").value,
                    );
                    formData.append(
                        "mosh",
                        document.querySelector("#mosh").checked
                            ? "true"
                            : "false",
                    );

                    const response = await fetch("/mosh", {
                        method: "POST",
                        body: formData,
                    });

                    if (!response.ok) {
                        throw new Error(await readErrorMessage(response));
                    }

                    const blob = await response.blob();
                    resultUrl = URL.createObjectURL(blob);

                    resultVideo.src = resultUrl;
                    resultVideo.hidden = false;

                    downloadLink.href = resultUrl;
                    downloadLink.hidden = false;

                    setStatus("done.");
                } catch (error) {
                    setStatus(error.message || "something went wrong.", true);
                } finally {
                    generateButton.disabled = false;
                }
            });

            function bindPreview(inputId, videoId) {
                const input = document.querySelector(`#${inputId}`);
                const video = document.querySelector(`#${videoId}`);

                input.addEventListener("change", () => {
                    const file = input.files[0];

                    if (!file) {
                        video.removeAttribute("src");
                        return;
                    }

                    video.src = URL.createObjectURL(file);
                });
            }

            async function readErrorMessage(response) {
                const contentType = response.headers.get("content-type") || "";

                if (contentType.includes("application/json")) {
                    const data = await response.json();

                    if (typeof data.detail === "string") {
                        return data.detail;
                    }

                    if (
                        data.detail &&
                        typeof data.detail.message === "string"
                    ) {
                        return data.detail.message;
                    }

                    return JSON.stringify(data);
                }

                return await response.text();
            }

            function secondsToTimestamp(seconds) {
                const safeSeconds = Number.isFinite(seconds) ? seconds : 0;
                const wholeSeconds = Math.floor(safeSeconds);
                const hours = Math.floor(wholeSeconds / 3600);
                const minutes = Math.floor((wholeSeconds % 3600) / 60);
                const secs = wholeSeconds % 60;
                const milliseconds = Math.round(
                    (safeSeconds - wholeSeconds) * 1000,
                );

                const base = [
                    hours.toString().padStart(2, "0"),
                    minutes.toString().padStart(2, "0"),
                    secs.toString().padStart(2, "0"),
                ].join(":");

                if (milliseconds === 0) {
                    return base;
                }

                return `${base}.${milliseconds.toString().padStart(3, "0")}`;
            }

            function setStatus(message, isError = false) {
                statusEl.textContent = message;
                statusEl.classList.toggle("error", isError);
            }

            function clearResult() {
                if (resultUrl) {
                    URL.revokeObjectURL(resultUrl);
                    resultUrl = null;
                }

                resultVideo.hidden = true;
                resultVideo.removeAttribute("src");

                downloadLink.hidden = true;
                downloadLink.removeAttribute("href");
            }
        </script>
    </body>
</html>
